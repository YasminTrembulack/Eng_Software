<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}" />
    <title>Document</title>
  </head>
  <body>
    <main>
        <h1>{{title}}</h1>
        <table>
          <thead>
            <tr>
                <th>Nome</th>
            </tr>
          </thead>
          <tbody>
            {% for item in list %}
            <tr>
                <td>{{ item }}</td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
    </main>
  </body>
</html>
