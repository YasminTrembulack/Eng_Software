<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <title>Download/Upload</title>
</head>

<body>
    {% with messages = get_flashed_messages(with_categories=True) %}
    {% if messages %}
    <div id="flash-messages">
        {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    <header>
        <h1>Arquivos</h1>
    </header>
    <main>

        <div class="upload-form">
            <h2>Upload:</h2>
            <form action="/diretorio" method="POST" enctype="multipart/form-data">
                <p>
                    <input type="file" name="meu_arquivo" id="meu_arquivo" required>
                </p>
                <p>
                    <button type="submit">Enviar</button>
                </p>
            </form>
        </div>
    
        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                </tr>
            </thead>
            <tbody>
                {% for arquivo in arquivos %}
                <tr>
                    <td>
                        <a href="{{ url_for('download', filename=arquivo) }}">
                            {{ arquivo }}
                        </a>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="2" class="empty">Nenhum arquivo encontrado</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </main>
    <script>
        setTimeout(() => {
            const flash = document.getElementById('flash-messages');
            if (flash) {
                flash.style.display = 'none';
            }
        }, 3000);
    </script>
</body>

</html>
