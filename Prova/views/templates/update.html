<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <title>Editar Ingresso</title>
</head>
<body>
    {% with messages = get_flashed_messages(with_categories=True) %}
        {% if messages %}
            <div id="flash-messages">
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}
        
    <header>
        <h1>Editar Ingresso</h1>
        <p><a href="/">Voltar</a></p>
    </header>

    <form action="{{ url_for('update_ingresso', ingresso_id=ticket.id) }}" method="POST" class="create-form">

        <input type="text" name="nome_filme" placeholder="Nome do Filme" value="{{ ticket.nome_filme }}" required />

        <input type="text" name="genero" placeholder="Genero" value="{{ ticket.genero }}" required />
        
        <input type="text" name="nome_cliente" placeholder="Nome do Cliente" value="{{ ticket.nome_cliente }}" required />
        
        <select name="sessoes" required>
            <option value="">Selecione a sessão</option>
            <option value="Sala 1 - 19h" {{ 'selected' if ticket.sessoes == 'Sala 1 - 19h' else '' }}>Sala 1 - 19h</option>
            <option value="Sala 2 - 20h" {{ 'selected' if ticket.sessoes == 'Sala 2 - 20h' else '' }}>Sala 2 - 20h</option>
            <option value="Sala 3 - 21h" {{ 'selected' if ticket.sessoes == 'Sala 3 - 21h' else '' }}>Sala 3 - 21h</option>
        </select>

        <input type="text" name="assento" placeholder="Assento (ex: B12)" value="{{ ticket.assento }}" required />
        
        <input type="date" name="data_filme" value="{{ ticket.data_filme.strftime('%Y-%m-%d')}}" required />

        <button type="submit">Salvar alterações</button>
    </form>
    <script>
        setTimeout(() => {
            const flash = document.getElementById('flash-messages');
            if (flash) {
                flash.style.display = 'none';
            }
        }, 2500);
    </script>
</body>
</html>
