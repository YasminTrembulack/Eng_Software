<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <title>Cadastrar Ingresso</title>
</head>
<body>
    {% with messages = get_flashed_messages(with_categories=True) %}
        {% if messages %}
            <div id="flash-messages">
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}
        
    <header>
        <h1>Cadastrar Ingresso</h1>
        <p><a href="/">Voltar</a></p>
    </header>

    <form action="{{ url_for('create_ingressos') }}" method="POST" class="create-form">

        <input type="text" name="nome_filme" placeholder="Nome do Filme" required />

        <input type="text" name="genero" placeholder="Genero" required />
        
        <input type="text" name="nome_cliente" placeholder="Nome do Cliente" required />
        
        <select name="sessoes" required>
            <option value="">Selecione a sessão</option>
            <option value="Sala 1 - 19h" selected>Sala 1 - 19h</option>
            <option value="Sala 2 - 20h">Sala 2 - 20h</option>
            <option value="Sala 3 - 21h">Sala 3 - 21h</option>
        </select>

        <input type="text" name="assento" placeholder="Assento (ex: B12)" required />
        
        <input type="date" name="data_filme" required />

        <button type="submit">Cadastrar</button>
    </form>
    <script>
        setTimeout(() => {
            const flash = document.getElementById('flash-messages');
            if (flash) {
                flash.style.display = 'none';
            }
        }, 2500);
    </script>
</body>
</html>
