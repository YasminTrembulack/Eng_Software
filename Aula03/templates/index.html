<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <title>Lista de Usuários</title>
</head>
<body>
    <header>
        <h1>Usuários</h1>
        <p><a href="{{ url_for('create_user') }}">Cadastrar novo usuário</a></p>
    </header>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Email</th>
                <th>Aniversário</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users_list %}
                <tr>
                    <td>{{ user.id }}</td>
                    <td>{{ user.nome }}</td>
                    <td>{{ user.email }}</td>
                    <td>{{ user.aniversario }}</td>
                </tr>
            {% else %}
                <tr>
                    <td colspan="4" class="empty">Nenhum usuário encontrado</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
